name: ROA constellation — historical v1 and public hub v2
on:
  push:
    paths: ['README.md', 'PROGRAMME.json', 'PROGRAMME_HEADER_CONTRACT.md', 'scripts/check_programme_v2.py', '.github/workflows/lumen-constellation.yml']
  pull_request:
    paths: ['README.md', 'PROGRAMME.json', 'PROGRAMME_HEADER_CONTRACT.md', 'scripts/check_programme_v2.py', '.github/workflows/lumen-constellation.yml']
permissions:
  contents: read
jobs:
  programme-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate historical source and receipt on original baseline
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'git worktree remove --force "$temp" >/dev/null 2>&1 || true' EXIT
          git worktree add --detach "$temp" 5182e84ff87594b334bb4e256581511206ba61ef
          ( cd "$temp" && python3 scripts/check_lumen_constellation.py && python3 scripts/falsify_hub_semantics.py --check )
      - name: Validate new public nine-repository v2 and negative mutants
        run: python3 scripts/check_programme_v2.py
